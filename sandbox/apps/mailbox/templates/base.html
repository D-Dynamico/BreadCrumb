<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Mail{% endblock %} · Acme Mail</title>
<script src="/static/htmx.min.js" defer></script>
<style>
  body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; color: #202124; background: #f6f8fc; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e0e3e7; }
  header .brand { font-size: 20px; font-weight: 600; color: #0b57d0; }
  header .who { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  header .who button { background: none; border: 1px solid #c4c7c5; padding: 4px 10px; border-radius: 14px; cursor: pointer; }
  .layout { display: flex; }
  aside { width: 200px; padding: 16px; }
  aside a { display: block; padding: 8px 14px; border-radius: 16px; color: #202124; text-decoration: none; margin-bottom: 4px; }
  aside a[aria-current="page"] { background: #d3e3fd; font-weight: 600; }
  aside a.compose { background: #c2e7ff; font-weight: 600; margin-bottom: 14px; }
  main { flex: 1; margin: 16px 20px 16px 0; background: #fff; border-radius: 12px; padding: 16px 24px; min-height: 70vh; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 9px 8px; border-bottom: 1px solid #eceff1; text-align: left; font-size: 14px; }
  th { color: #5f6368; font-weight: 600; }
  td a { color: inherit; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .meta { color: #5f6368; font-size: 14px; }
  .body { white-space: pre-wrap; line-height: 1.5; margin-top: 18px; }
  form.stack label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
  form.stack input, form.stack textarea { display: block; width: 640px; padding: 8px; margin-top: 4px; border: 1px solid #c4c7c5; border-radius: 6px; font: inherit; }
  form.stack textarea { height: 220px; }
  .btn { background: #0b57d0; color: #fff; border: 0; padding: 9px 22px; border-radius: 18px; font: inherit; cursor: pointer; }
  .errors { background: #fce8e6; border: 1px solid #f28b82; padding: 10px 14px; border-radius: 6px; }
  .notice { background: #e6f4ea; border: 1px solid #81c995; padding: 10px 14px; border-radius: 6px; }
  .field-error { color: #b3261e; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <span class="brand">Acme Mail</span>
  {% if current_user %}
  <div class="who">
    <span>{{ current_user }}</span>
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </div>
  {% endif %}
</header>
{% if current_user %}
<div class="layout">
  <aside>
    <nav aria-label="Folders">
      <a class="compose" href="/compose">Compose</a>
      <a href="/inbox" {% if folder == "inbox" %}aria-current="page"{% endif %}>Inbox</a>
      <a href="/sent" {% if folder == "sent" %}aria-current="page"{% endif %}>Sent</a>
    </nav>
  </aside>
  <main>{% block content %}{% endblock %}</main>
</div>
{% else %}
<main style="max-width:460px;margin:40px auto">{{ self.content() }}</main>
{% endif %}
</body>
</html>
