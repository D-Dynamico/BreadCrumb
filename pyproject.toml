[project]
name = "breadcrumb"
version = "0.1.0"
description = "An AI worker that can be interrupted and still finish the job."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
breadcrumb = "breadcrumb.cli:main"
tasks = "tasks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["breadcrumb", "sandbox", "harness", "scripts", "tasks.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["breadcrumb", "sandbox", "harness", "scripts", "tasks.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
